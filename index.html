<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片水印工具 | Watermark Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #07070a;
      --bg-elevated: #0d0d12;
      --card: #12121a;
      --border: #1e1e2a;
      --fg: #e8e8ed;
      --muted: #6b6b7a;
      --accent: #00ff88;
      --accent-dim: rgba(0, 255, 136, 0.15);
      --danger: #ff4757;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }

    h1,
    h2,
    h3,
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Background atmosphere */
    .bg-atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-atmosphere::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse 600px 400px at 20% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 500px 500px at 80% 80%, rgba(0, 150, 255, 0.05) 0%, transparent 60%);
      animation: float 20s ease-in-out infinite;
    }

    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }

      33% {
        transform: translate(30px, -30px) rotate(1deg);
      }

      66% {
        transform: translate(-20px, 20px) rotate(-1deg);
      }
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border);
      background: linear-gradient(135deg, var(--card) 0%, var(--bg-elevated) 100%);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--accent);
      background: linear-gradient(135deg, var(--accent-dim) 0%, var(--bg-elevated) 100%);
      transform: scale(1.01);
    }

    .drop-zone.drag-over {
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.2);
    }

    /* Canvas container */
    .canvas-container {
      background:
        linear-gradient(45deg, #1a1a24 25%, transparent 25%),
        linear-gradient(-45deg, #1a1a24 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1a1a24 75%),
        linear-gradient(-45deg, transparent 75%, #1a1a24 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: var(--card);
    }

    /* Controls */
    .control-group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      transition: border-color 0.2s;
    }

    .control-group:hover {
      border-color: rgba(0, 255, 136, 0.3);
    }

    .control-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.5rem;
      display: block;
    }

    input[type="text"],
    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.625rem 0.875rem;
      border-radius: 8px;
      width: 100%;
      transition: all 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 12px var(--accent);
    }

    input[type="color"] {
      -webkit-appearance: none;
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid var(--border);
      border-radius: 8px;
    }

    /* Position grid */
    .position-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .position-btn {
      aspect-ratio: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .position-btn::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      transition: all 0.2s;
    }

    .position-btn:hover {
      border-color: var(--accent);
    }

    .position-btn:hover::before {
      background: var(--accent);
    }

    .position-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    .position-btn.active::before {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* Buttons */
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      padding: 0.875rem 1.5rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 255, 136, 0.3);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--fg);
      font-weight: 500;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      border-color: var(--muted);
      background: var(--card);
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      opacity: 0;
    }

    .delay-1 {
      animation-delay: 0.1s;
    }

    .delay-2 {
      animation-delay: 0.2s;
    }

    .delay-3 {
      animation-delay: 0.3s;
    }

    .delay-4 {
      animation-delay: 0.4s;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-in {
        animation: none;
        opacity: 1;
      }

      .bg-atmosphere::before {
        animation: none;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* Focus visible */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>

<body class="antialiased">
  <!-- Background -->
  <div class="bg-atmosphere">
    <div class="grid-pattern"></div>
  </div>

  <!-- Main Content -->
  <main class="relative z-10 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
      <!-- Header -->
      <header class="text-center mb-8 md:mb-12 animate-in">
        <h1 class="text-3xl md:text-5xl font-bold tracking-tight mb-3">
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">Watermark</span>
          <span class="text-[var(--accent)]">Studio</span>
        </h1>
        <p class="text-[var(--muted)] text-sm md:text-base max-w-md mx-auto">
          为您的图片添加专业水印，支持实时预览与多种自定义选项
        </p>
      </header>

      <!-- Main Grid -->
      <div class="grid lg:grid-cols-[1fr,340px] gap-6">
        <!-- Preview Area -->
        <div class="animate-in delay-1">
          <!-- Drop Zone (shown when no image) -->
          <div id="dropZone"
            class="drop-zone rounded-2xl p-8 md:p-12 text-center cursor-pointer min-h-[400px] md:min-h-[500px] flex flex-col items-center justify-center">
            <div class="w-20 h-20 rounded-2xl bg-[var(--accent-dim)] flex items-center justify-center mb-6">
              <svg class="w-10 h-10 text-[var(--accent)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </div>
            <h3 class="text-xl font-semibold mb-2">拖放图片到这里</h3>
            <p class="text-[var(--muted)] text-sm mb-4">或点击选择文件</p>
            <p class="text-[var(--muted)] text-xs">支持 JPG、PNG、WebP 格式</p>
            <input type="file" id="fileInput" accept="image/*" class="hidden" aria-label="选择图片文件">
          </div>

          <!-- Canvas Preview (shown when image loaded) -->
          <div id="previewArea" class="hidden">
            <div class="canvas-container rounded-2xl overflow-hidden relative">
              <canvas id="canvas" class="max-w-full h-auto block mx-auto"></canvas>
            </div>
            <div class="flex items-center justify-between mt-4 gap-4">
              <button id="changeImageBtn" class="btn-secondary text-sm">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                更换图片
              </button>
              <div class="text-xs text-[var(--muted)]" id="imageInfo"></div>
            </div>
          </div>
        </div>

        <!-- Controls Panel -->
        <div class="space-y-4 animate-in delay-2">
          <!-- Watermark Text -->
          <div class="control-group">
            <label class="control-label">水印文字</label>
            <input type="text" id="watermarkText" value="© 版权所有" placeholder="输入水印文字..." maxlength="100">
          </div>

          <!-- Font Settings -->
          <div class="control-group">
            <label class="control-label">字体设置</label>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <span class="text-xs text-[var(--muted)] mb-1 block">字号</span>
                <input type="number" id="fontSize" value="32" min="12" max="200">
              </div>
              <div>
                <span class="text-xs text-[var(--muted)] mb-1 block">颜色</span>
                <input type="color" id="fontColor" value="#ffffff">
              </div>
            </div>
          </div>

          <!-- Opacity -->
          <div class="control-group">
            <div class="flex items-center justify-between mb-2">
              <label class="control-label mb-0">透明度</label>
              <span id="opacityValue" class="text-sm font-medium text-[var(--accent)]">50%</span>
            </div>
            <input type="range" id="opacity" min="5" max="100" value="50">
          </div>

          <!-- Rotation -->
          <div class="control-group">
            <div class="flex items-center justify-between mb-2">
              <label class="control-label mb-0">旋转角度</label>
              <span id="rotationValue" class="text-sm font-medium text-[var(--accent)]">-30°</span>
            </div>
            <input type="range" id="rotation" min="-180" max="180" value="-30">
          </div>

          <!-- Position -->
          <div class="control-group">
            <label class="control-label">水印位置</label>
            <div class="position-grid">
              <button class="position-btn" data-pos="top-left" aria-label="左上"></button>
              <button class="position-btn" data-pos="top-center" aria-label="上中"></button>
              <button class="position-btn" data-pos="top-right" aria-label="右上"></button>
              <button class="position-btn" data-pos="middle-left" aria-label="左中"></button>
              <button class="position-btn active" data-pos="middle-center" aria-label="居中"></button>
              <button class="position-btn" data-pos="middle-right" aria-label="右中"></button>
              <button class="position-btn" data-pos="bottom-left" aria-label="左下"></button>
              <button class="position-btn" data-pos="bottom-center" aria-label="下中"></button>
              <button class="position-btn" data-pos="bottom-right" aria-label="右下"></button>
            </div>
          </div>

          <!-- Tile Mode -->
          <div class="control-group">
            <label class="flex items-center gap-3 cursor-pointer select-none">
              <input type="checkbox" id="tileMode" class="sr-only peer">
              <div
                class="w-10 h-6 bg-[var(--border)] rounded-full peer peer-checked:bg-[var(--accent)] relative transition-colors">
                <div
                  class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-4">
                </div>
              </div>
              <span class="text-sm">平铺水印</span>
            </label>
          </div>

          <!-- Download Button -->
          <button id="downloadBtn" class="btn-primary w-full justify-center mt-6" disabled>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            下载图片
          </button>
        </div>
      </div>

      <!-- Footer -->
      <footer class="text-center mt-12 text-[var(--muted)] text-xs animate-in delay-4">
        <p>所有处理均在本地完成，图片不会上传到服务器</p>
      </footer>
    </div>
  </main>

  <script>
    // State
    const state = {
      image: null,
      position: 'middle-center',
      tileMode: false
    };

    // DOM Elements - 提前初始化避免引用错误
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewArea = document.getElementById('previewArea');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const watermarkText = document.getElementById('watermarkText');
    const fontSize = document.getElementById('fontSize');
    const fontColor = document.getElementById('fontColor');
    const opacity = document.getElementById('opacity');
    const opacityValue = document.getElementById('opacityValue');
    const rotation = document.getElementById('rotation');
    const rotationValue = document.getElementById('rotationValue');
    const positionBtns = document.querySelectorAll('.position-btn');
    const tileMode = document.getElementById('tileMode');
    const downloadBtn = document.getElementById('downloadBtn');
    const changeImageBtn = document.getElementById('changeImageBtn');
    const imageInfo = document.getElementById('imageInfo');

    // File handling
    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        alert('请选择有效的图片文件');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          state.image = img;
          dropZone.classList.add('hidden');
          previewArea.classList.remove('hidden');
          downloadBtn.disabled = false;

          // Show image info
          imageInfo.textContent = `${img.width} × ${img.height} px`;

          renderCanvas();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Drag and drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      handleFile(file);
    });

    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      handleFile(file);
    });

    changeImageBtn.addEventListener('click', () => {
      fileInput.click();
    });

    // Hex to RGBA helper
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    // Render canvas
    function renderCanvas() {
      if (!state.image) return;

      const img = state.image;

      // Limit canvas size for performance
      let maxWidth = 1200;
      let maxHeight = 1200;
      let width = img.width;
      let height = img.height;

      if (width > maxWidth || height > maxHeight) {
        const ratio = Math.min(maxWidth / width, maxHeight / height);
        width = Math.floor(width * ratio);
        height = Math.floor(height * ratio);
      }

      // Ensure positive dimensions
      width = Math.max(1, width);
      height = Math.max(1, height);

      canvas.width = width;
      canvas.height = height;

      // Draw image
      ctx.drawImage(img, 0, 0, width, height);

      // Get watermark settings
      const text = watermarkText.value || '';
      if (!text.trim()) return;

      const size = Math.max(12, Math.min(200, parseInt(fontSize.value) || 32));
      const color = fontColor.value || '#ffffff';
      const alpha = Math.max(0.05, Math.min(1, (parseInt(opacity.value) || 50) / 100));
      const angle = parseInt(rotation.value) || 0;

      // Set font
      ctx.font = `bold ${size}px "Space Grotesk", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = hexToRgba(color, alpha);

      if (state.tileMode) {
        // Tile mode
        const textWidth = ctx.measureText(text).width;
        const gapX = Math.max(textWidth + 50, 100);
        const gapY = Math.max(size * 2, 60);

        ctx.save();
        ctx.translate(width / 2, height / 2);
        ctx.rotate((angle * Math.PI) / 180);

        const diagonal = Math.sqrt(width * width + height * height);
        const cols = Math.ceil(diagonal / gapX) + 2;
        const rows = Math.ceil(diagonal / gapY) + 2;

        for (let i = -rows; i <= rows; i++) {
          for (let j = -cols; j <= cols; j++) {
            const x = j * gapX;
            const y = i * gapY;
            ctx.fillText(text, x, y);
          }
        }
        ctx.restore();
      } else {
        // Single watermark
        const padding = 30;
        const textWidth = ctx.measureText(text).width;

        let x, y;

        switch (state.position) {
          case 'top-left':
            x = padding + textWidth / 2;
            y = padding + size / 2;
            break;
          case 'top-center':
            x = width / 2;
            y = padding + size / 2;
            break;
          case 'top-right':
            x = width - padding - textWidth / 2;
            y = padding + size / 2;
            break;
          case 'middle-left':
            x = padding + textWidth / 2;
            y = height / 2;
            break;
          case 'middle-center':
            x = width / 2;
            y = height / 2;
            break;
          case 'middle-right':
            x = width - padding - textWidth / 2;
            y = height / 2;
            break;
          case 'bottom-left':
            x = padding + textWidth / 2;
            y = height - padding - size / 2;
            break;
          case 'bottom-center':
            x = width / 2;
            y = height - padding - size / 2;
            break;
          case 'bottom-right':
            x = width - padding - textWidth / 2;
            y = height - padding - size / 2;
            break;
          default:
            x = width / 2;
            y = height / 2;
        }

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((angle * Math.PI) / 180);
        ctx.fillText(text, 0, 0);
        ctx.restore();
      }
    }

    // Event listeners for controls
    watermarkText.addEventListener('input', renderCanvas);
    fontSize.addEventListener('input', renderCanvas);
    fontColor.addEventListener('input', renderCanvas);

    opacity.addEventListener('input', () => {
      opacityValue.textContent = `${opacity.value}%`;
      renderCanvas();
    });

    rotation.addEventListener('input', () => {
      rotationValue.textContent = `${rotation.value}°`;
      renderCanvas();
    });

    // Position buttons
    positionBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        positionBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.position = btn.dataset.pos;
        renderCanvas();
      });
    });

    // Tile mode
    tileMode.addEventListener('change', () => {
      state.tileMode = tileMode.checked;
      renderCanvas();
    });

    // Download
    downloadBtn.addEventListener('click', () => {
      if (!state.image) return;

      const link = document.createElement('a');
      link.download = `watermarked_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Keyboard accessibility for position buttons
    positionBtns.forEach((btn, index) => {
      btn.addEventListener('keydown', (e) => {
        let newIndex = index;
        if (e.key === 'ArrowRight') newIndex = (index + 1) % 9;
        if (e.key === 'ArrowLeft') newIndex = (index - 1 + 9) % 9;
        if (e.key === 'ArrowDown') newIndex = (index + 3) % 9;
        if (e.key === 'ArrowUp') newIndex = (index - 3 + 9) % 9;

        if (newIndex !== index) {
          positionBtns[newIndex].focus();
          positionBtns[newIndex].click();
        }
      });
    });
  </script>
</body>

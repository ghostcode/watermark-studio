<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批量水印工具 | Watermark Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #07070a;
      --bg-elevated: #0d0d12;
      --card: #12121a;
      --border: #1e1e2a;
      --fg: #e8e8ed;
      --muted: #6b6b7a;
      --accent: #00ff88;
      --accent-dim: rgba(0, 255, 136, 0.15);
      --danger: #ff4757;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }

    h1,
    h2,
    h3,
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }

    .bg-atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-atmosphere::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse 600px 400px at 20% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 500px 500px at 80% 80%, rgba(0, 150, 255, 0.05) 0%, transparent 60%);
      animation: float 20s ease-in-out infinite;
    }

    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }

      33% {
        transform: translate(30px, -30px) rotate(1deg);
      }

      66% {
        transform: translate(-20px, 20px) rotate(-1deg);
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    .drop-zone {
      border: 2px dashed var(--border);
      background: linear-gradient(135deg, var(--card) 0%, var(--bg-elevated) 100%);
      transition: all 0.3s;
      cursor: pointer;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--accent);
      background: linear-gradient(135deg, var(--accent-dim) 0%, var(--bg-elevated) 100%);
    }

    .canvas-container {
      background:
        linear-gradient(45deg, #1a1a24 25%, transparent 25%),
        linear-gradient(-45deg, #1a1a24 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1a1a24 75%),
        linear-gradient(-45deg, transparent 75%, #1a1a24 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: var(--card);
    }

    .control-group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      transition: border-color 0.2s;
    }

    .control-group:hover {
      border-color: rgba(0, 255, 136, 0.2);
    }

    .control-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.5rem;
      display: block;
    }

    input[type="text"],
    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      width: 100%;
      transition: all 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    input[type="color"] {
      -webkit-appearance: none;
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .mode-switcher {
      display: flex;
      background: var(--bg);
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }

    .mode-btn {
      flex: 1;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: var(--bg);
    }

    .position-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }

    .position-btn {
      aspect-ratio: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .position-btn::before {
      content: '';
      width: 4px;
      height: 4px;
      background: var(--muted);
      border-radius: 50%;
      transition: all 0.2s;
    }

    .position-btn:hover {
      border-color: var(--accent);
    }

    .position-btn:hover::before {
      background: var(--accent);
    }

    .position-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    .position-btn.active::before {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Custom styles for header button */
    .btn-header {
      padding: 0.5rem 1rem;
      width: auto;
      font-size: 0.8rem;
    }

    .btn-icon {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.4rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover:not(:disabled) {
      color: var(--fg);
      border-color: var(--fg);
    }

    .btn-icon:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--fg);
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.8rem;
    }

    .btn-secondary:hover {
      border-color: var(--muted);
      background: var(--card);
    }

    .list-panel {
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .thumbnail-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      background: var(--card);
    }

    .thumbnail-item:hover {
      border-color: var(--muted);
    }

    .thumbnail-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    .thumbnail-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumbnail-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      color: #fff;
      cursor: pointer;
    }

    .thumbnail-item:hover .thumbnail-remove {
      opacity: 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @media (prefers-reduced-motion: reduce) {

      .bg-atmosphere::before,
      .fade-in {
        animation: none;
      }
    }

    /* Responsive Layout Adjustments */
    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr !important;
        grid-template-rows: auto 1fr auto;
      }

      .list-panel {
        border-right: none;
        border-bottom: 1px solid var(--border);
        max-height: 150px;
        flex-direction: row;
      }

      .list-header {
        display: none;
      }

      .thumbnail-list {
        display: flex !important;
        gap: 0.5rem;
        padding: 0.5rem !important;
        width: auto;
        flex: 1;
      }

      .thumbnail-item {
        width: 80px;
        flex-shrink: 0;
      }
    }
  </style>
</head>

<body class="antialiased">
  <div class="bg-atmosphere">
    <div class="grid-pattern"></div>
  </div>

  <main class="relative z-10 h-screen flex flex-col p-2 md:p-4">
    <!-- Header -->
    <header class="flex items-center justify-between mb-4 fade-in py-1 px-1">
      <div class="flex items-center gap-2">
        <h1 class="text-xl md:text-2xl font-bold tracking-tight">
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">Watermark</span>
          <span class="text-[var(--accent)]">Studio</span>
        </h1>
        <span
          class="text-[10px] font-normal text-[var(--muted)] bg-[var(--card)] px-1.5 py-0.5 rounded border border-[var(--border)]">BATCH</span>
      </div>

      <div class="flex items-center gap-3">
        <!-- Desktop Download Button (Visible > 1024px) -->
        <button id="downloadBtnDesktop" class="btn-primary btn-header hidden lg:flex" disabled>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>下载全部</span>
        </button>

        <div class="flex items-center gap-2 border-l border-[var(--border)] pl-3 ml-1">
          <button id="undoBtn" class="btn-icon" title="撤销水印操作 (Ctrl+Z)" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
            </svg>
          </button>
          <button id="redoBtn" class="btn-icon" title="重做水印操作 (Ctrl+Y)" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Grid -->
    <div class="main-grid grid grid-cols-[200px_1fr_300px] gap-4 flex-1 min-h-0">

      <!-- Left: Image List -->
      <div class="list-panel rounded-xl overflow-hidden fade-in">
        <div class="list-header p-3 border-b border-[var(--border)] flex items-center justify-between">
          <h3 class="text-xs font-semibold text-[var(--muted)] uppercase tracking-wider">列表 (<span
              id="imageCount">0</span>)</h3>
        </div>
        <div class="p-2 flex-1 overflow-y-auto" id="dropZoneArea">
          <div id="thumbnailList" class="grid grid-cols-2 gap-2"></div>
          <div id="emptyListHint" class="text-center text-[var(--muted)] text-xs py-8">
            <p>拖拽图片到此处</p>
          </div>
        </div>
        <div class="p-2 border-t border-[var(--border)]">
          <label class="btn-secondary w-full block text-center cursor-pointer">
            <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
            + 上传图片
          </label>
        </div>
      </div>

      <!-- Center: Preview -->
      <div class="flex flex-col gap-3 fade-in delay-100 min-h-0">
        <div id="dropZoneOverlay"
          class="hidden absolute inset-0 bg-[var(--accent-dim)] z-10 rounded-xl pointer-events-none border-2 border-dashed border-[var(--accent)] flex items-center justify-center">
          <span class="text-[var(--accent)] text-lg font-semibold">释放添加</span>
        </div>

        <div
          class="canvas-container rounded-xl flex-1 flex items-center justify-center relative overflow-hidden min-h-[300px] bg-[var(--card)]">
          <div id="placeholder" class="text-center p-8">
            <svg class="w-16 h-16 mx-auto text-[var(--border)] mb-4" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <p class="text-[var(--muted)]">上传图片开始</p>
          </div>
          <canvas id="canvas" class="max-w-full max-h-full hidden"></canvas>
        </div>

        <div class="flex items-center justify-between text-xs text-[var(--muted)] px-1">
          <span id="imageName">未选择图片</span>
          <span id="imageInfo"></span>
        </div>
      </div>

      <!-- Right: Controls -->
      <div class="space-y-3 overflow-y-auto pr-1 fade-in delay-200">
        <div class="control-group">
          <div class="mode-switcher">
            <button class="mode-btn active" data-mode="text">文字</button>
            <button class="mode-btn" data-mode="image">Logo</button>
          </div>
        </div>

        <div id="textControls">
          <div class="control-group">
            <input type="text" id="watermarkText" value="© 版权所有" placeholder="水印文字...">
          </div>
          <div class="control-group">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="control-label">字号</label>
                <input type="number" id="fontSize" value="32" min="12" max="200">
              </div>
              <div>
                <label class="control-label">颜色</label>
                <input type="color" id="fontColor" value="#ffffff">
              </div>
            </div>
          </div>
        </div>

        <div id="imageControls" class="hidden">
          <div class="control-group">
            <label class="control-label">Logo图片</label>
            <div class="flex gap-2 items-center">
              <div
                class="w-10 h-10 rounded bg-[var(--bg)] border border-[var(--border)] flex items-center justify-center overflow-hidden"
                id="logoPreview">
                <svg class="w-5 h-5 text-[var(--muted)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              </div>
              <label class="btn-secondary flex-1 text-center cursor-pointer">
                选择图片
                <input type="file" id="logoInput" accept="image/*" class="hidden">
              </label>
            </div>
          </div>
          <div class="control-group">
            <div class="flex justify-between"><label class="control-label">缩放</label><span id="scaleValue"
                class="text-xs text-[var(--accent)]">20%</span></div>
            <input type="range" id="logoScale" min="5" max="100" value="20">
          </div>
        </div>

        <div class="control-group">
          <div class="flex justify-between"><label class="control-label">透明度</label><span id="opacityValue"
              class="text-xs text-[var(--accent)]">50%</span></div>
          <input type="range" id="opacity" min="5" max="100" value="50">
        </div>

        <div class="control-group">
          <div class="flex justify-between"><label class="control-label">旋转</label><span id="rotationValue"
              class="text-xs text-[var(--accent)]">-30°</span></div>
          <input type="range" id="rotation" min="-180" max="180" value="-30">
        </div>

        <div class="control-group">
          <label class="control-label">位置</label>
          <div class="position-grid">
            <button class="position-btn" data-pos="top-left"></button>
            <button class="position-btn" data-pos="top-center"></button>
            <button class="position-btn" data-pos="top-right"></button>
            <button class="position-btn" data-pos="middle-left"></button>
            <button class="position-btn active" data-pos="middle-center"></button>
            <button class="position-btn" data-pos="middle-right"></button>
            <button class="position-btn" data-pos="bottom-left"></button>
            <button class="position-btn" data-pos="bottom-center"></button>
            <button class="position-btn" data-pos="bottom-right"></button>
          </div>
        </div>

        <div class="control-group">
          <label class="flex items-center gap-3 cursor-pointer select-none">
            <input type="checkbox" id="tileMode" class="sr-only peer">
            <div
              class="w-9 h-5 bg-[var(--border)] rounded-full peer peer-checked:bg-[var(--accent)] relative transition-colors">
              <div
                class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-4">
              </div>
            </div>
            <span class="text-xs">平铺水印</span>
          </label>
        </div>

        <!-- Mobile Download Button (Visible < 1024px) -->
        <button id="downloadBtnMobile" class="btn-primary mt-2 lg:hidden" disabled>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          下载全部 (ZIP)
        </button>
      </div>
    </div>
  </main>

  <script>
    // --- State Management ---
    const state = {
      images: [],
      logo: null,
      currentIndex: -1,
      position: 'middle-center',
      tileMode: false,
      watermarkMode: 'text',
      processing: false
    };

    // --- History Management (Watermark Only) ---
    let tempStateBeforeChange = null;

    const history = {
      undoStack: [],
      redoStack: [],
      maxHistory: 50,

      capture() {
        return {
          logo: state.logo,
          logoSrc: state.logo ? state.logo.src : null,
          watermarkMode: state.watermarkMode,
          text: document.getElementById('watermarkText').value,
          fontSize: document.getElementById('fontSize').value,
          fontColor: document.getElementById('fontColor').value,
          opacity: document.getElementById('opacity').value,
          rotation: document.getElementById('rotation').value,
          logoScale: document.getElementById('logoScale').value,
          position: state.position,
          tileMode: state.tileMode
        };
      },

      restore(snapshot) {
        state.logo = snapshot.logo;
        state.watermarkMode = snapshot.watermarkMode;
        state.position = snapshot.position;
        state.tileMode = snapshot.tileMode;

        document.getElementById('watermarkText').value = snapshot.text;
        document.getElementById('fontSize').value = snapshot.fontSize;
        document.getElementById('fontColor').value = snapshot.fontColor;
        document.getElementById('opacity').value = snapshot.opacity;
        document.getElementById('opacityValue').textContent = `${snapshot.opacity}%`;

        document.getElementById('rotation').value = snapshot.rotation;
        document.getElementById('rotationValue').textContent = `${snapshot.rotation}°`;

        document.getElementById('logoScale').value = snapshot.logoScale;
        document.getElementById('scaleValue').textContent = `${snapshot.logoScale}%`;

        document.getElementById('tileMode').checked = snapshot.tileMode;

        document.querySelectorAll('.position-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.pos === snapshot.position);
        });

        document.querySelectorAll('.mode-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.mode === snapshot.watermarkMode);
        });

        document.getElementById('textControls').classList.toggle('hidden', snapshot.watermarkMode !== 'text');
        document.getElementById('imageControls').classList.toggle('hidden', snapshot.watermarkMode !== 'image');

        const logoPreview = document.getElementById('logoPreview');
        if (snapshot.logoSrc) {
          logoPreview.innerHTML = `<img src="${snapshot.logoSrc}" class="w-full h-full object-contain">`;
          if (!state.logo || state.logo.src !== snapshot.logoSrc) {
            const img = new Image();
            img.src = snapshot.logoSrc;
            state.logo = img;
          }
        } else {
          state.logo = null;
          logoPreview.innerHTML = `<svg class="w-5 h-5 text-[var(--muted)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>`;
        }
      },

      pushSnapshot(snapshot) {
        this.undoStack.push(snapshot);
        if (this.undoStack.length > this.maxHistory) this.undoStack.shift();
        this.redoStack = [];
        this.updateUI();
      },

      push() {
        this.pushSnapshot(this.capture());
      },

      undo() {
        if (this.undoStack.length === 0) return;
        const current = this.capture();
        this.redoStack.push(current);
        const prev = this.undoStack.pop();
        this.restore(prev);
        this.updateUI();
        renderCanvas();
      },

      redo() {
        if (this.redoStack.length === 0) return;
        const current = this.capture();
        this.undoStack.push(current);
        const next = this.redoStack.pop();
        this.restore(next);
        this.updateUI();
        renderCanvas();
      },

      updateUI() {
        document.getElementById('undoBtn').disabled = history.undoStack.length === 0;
        document.getElementById('redoBtn').disabled = history.redoStack.length === 0;
      }
    };

    // --- DOM Elements ---
    const els = {
      fileInput: document.getElementById('fileInput'),
      logoInput: document.getElementById('logoInput'),
      canvas: document.getElementById('canvas'),
      ctx: document.getElementById('canvas').getContext('2d'),
      thumbnailList: document.getElementById('thumbnailList'),
      emptyHint: document.getElementById('emptyListHint'),
      placeholder: document.getElementById('placeholder'),
      imageCount: document.getElementById('imageCount'),
      imageName: document.getElementById('imageName'),
      imageInfo: document.getElementById('imageInfo'),

      modeBtns: document.querySelectorAll('.mode-btn'),
      textControls: document.getElementById('textControls'),
      imageControls: document.getElementById('imageControls'),
      watermarkText: document.getElementById('watermarkText'),
      fontSize: document.getElementById('fontSize'),
      fontColor: document.getElementById('fontColor'),
      opacity: document.getElementById('opacity'),
      rotation: document.getElementById('rotation'),
      positionBtns: document.querySelectorAll('.position-btn'),
      tileMode: document.getElementById('tileMode'),
      // Buttons
      downloadBtnDesktop: document.getElementById('downloadBtnDesktop'),
      downloadBtnMobile: document.getElementById('downloadBtnMobile'),
      undoBtn: document.getElementById('undoBtn'),
      redoBtn: document.getElementById('redoBtn'),
      logoPreview: document.getElementById('logoPreview'),
      logoScale: document.getElementById('logoScale'),
      scaleValue: document.getElementById('scaleValue')
    };

    // --- Utility Functions ---
    const hexToRgba = (hex, alpha) => {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    };
    const genId = () => Math.random().toString(36).substr(2, 9);

    // Helper to update both download buttons
    function setDownloadBtnState(disabled, isLoading = false, text = null) {
      const btns = [els.downloadBtnDesktop, els.downloadBtnMobile];
      btns.forEach(btn => {
        if (btn) {
          btn.disabled = disabled;
          // Only update text for mobile button as desktop button text is short
          if (btn.id === 'downloadBtnMobile' && text) {
            btn.innerHTML = `<svg class="w-4 h-4 ${isLoading ? 'animate-spin' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg> ${text}`;
          }
          // Handle loading state for desktop button
          if (btn.id === 'downloadBtnDesktop' && isLoading) {
            btn.innerHTML = `<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
          } else if (btn.id === 'downloadBtnDesktop') {
            btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg> <span>下载全部</span>`;
          }
        }
      });
    }

    // --- Core Logic ---

    function handleFiles(files) {
      const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
      if (!validFiles.length) return;

      const initialLength = state.images.length;

      validFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            state.images.push({ id: genId(), name: file.name, img: img });

            // If this is the first image loaded from this batch
            if (state.images.length === initialLength + 1) {
              selectImage(state.images.length - 1);
            }
            // Always update UI (count, empty hint, button states)
            updateGlobalUI();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function selectImage(index) {
      state.currentIndex = index;
      renderCanvas();
      updateThumbnails();
      updateGlobalUI(); // Ensure button states are updated

      const item = state.images[index];
      els.imageName.textContent = item ? item.name : '未选择';
      els.imageInfo.textContent = item ? `${item.img.width} × ${item.img.height} px` : '';
    }

    function removeImage(id, e) {
      e.stopPropagation();
      const index = state.images.findIndex(img => img.id === id);
      if (index > -1) {
        state.images.splice(index, 1);

        if (state.images.length === 0) {
          state.currentIndex = -1;
          els.canvas.classList.add('hidden');
          els.placeholder.classList.remove('hidden');
          els.imageName.textContent = '未选择';
          els.imageInfo.textContent = '';
        } else {
          if (state.currentIndex >= state.images.length) {
            state.currentIndex = state.images.length - 1;
          }
          selectImage(state.currentIndex);
        }
        updateGlobalUI();
      }
    }

    function updateGlobalUI() {
      els.imageCount.textContent = state.images.length;
      els.emptyHint.style.display = state.images.length ? 'none' : 'block';

      // Update Download Buttons
      setDownloadBtnState(state.images.length === 0 || state.processing);

      updateThumbnails();
    }

    function updateThumbnails() {
      els.thumbnailList.innerHTML = '';
      state.images.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `thumbnail-item ${index === state.currentIndex ? 'active' : ''}`;
        div.onclick = () => selectImage(index);

        const img = document.createElement('img');
        img.src = item.img.src;
        div.appendChild(img);

        const removeBtn = document.createElement('div');
        removeBtn.className = 'thumbnail-remove';
        removeBtn.innerHTML = `<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>`;
        removeBtn.onclick = (e) => removeImage(item.id, e);
        div.appendChild(removeBtn);

        els.thumbnailList.appendChild(div);
      });
    }

    // --- Rendering ---

    function renderCanvas() {
      if (state.currentIndex === -1 || !state.images[state.currentIndex]) return;

      const sourceImg = state.images[state.currentIndex].img;
      let { width, height } = sourceImg;
      const maxW = 1200, maxH = 900;
      if (width > maxW || height > maxH) {
        const ratio = Math.min(maxW / width, maxH / height);
        width = Math.floor(width * ratio);
        height = Math.floor(height * ratio);
      }

      const canvas = els.canvas;
      const ctx = els.ctx;
      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(sourceImg, 0, 0, width, height);

      const alpha = Math.max(0.05, Math.min(1, parseInt(els.opacity.value) / 100));
      const angle = parseInt(els.rotation.value) || 0;

      ctx.save();
      ctx.globalAlpha = alpha;

      if (state.watermarkMode === 'image' && state.logo) {
        renderImageWatermark(ctx, width, height, angle);
      } else {
        renderTextWatermark(ctx, width, height, angle);
      }

      ctx.restore();

      els.placeholder.classList.add('hidden');
      canvas.classList.remove('hidden');
    }

    function renderTextWatermark(ctx, w, h, angle) {
      const text = els.watermarkText.value;
      if (!text.trim()) return;

      const size = Math.max(12, parseInt(els.fontSize.value));
      const color = els.fontColor.value;

      ctx.font = `bold ${size}px "Space Grotesk", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = hexToRgba(color, 1);

      if (state.tileMode) {
        drawTiled(ctx, w, h, angle, (x, y) => ctx.fillText(text, x, y), ctx.measureText(text).width + 50, size * 2);
      } else {
        drawSingle(ctx, w, h, angle, (x, y) => ctx.fillText(text, x, y), ctx.measureText(text).width, size);
      }
    }

    function renderImageWatermark(ctx, w, h, angle) {
      const scale = Math.max(5, parseInt(els.logoScale.value)) / 100;
      let lw = state.logo.width;
      let lh = state.logo.height;

      const maxLW = w * scale;
      const maxLH = h * scale;
      const ratio = Math.min(maxLW / lw, maxLH / lh);
      lw *= ratio;
      lh *= ratio;

      if (state.tileMode) {
        drawTiled(ctx, w, h, angle, (x, y) => ctx.drawImage(state.logo, x - lw / 2, y - lh / 2, lw, lh), lw + 30, lh + 30);
      } else {
        drawSingle(ctx, w, h, angle, (x, y) => ctx.drawImage(state.logo, x - lw / 2, y - lh / 2, lw, lh), lw, lh, true);
      }
    }

    function getCoords(pos, w, h, elemW, elemH, padding = 30) {
      let x, y;
      const cx = elemW / 2;
      const cy = elemH / 2;

      switch (pos) {
        case 'top-left': x = padding + cx; y = padding + cy; break;
        case 'top-center': x = w / 2; y = padding + cy; break;
        case 'top-right': x = w - padding - cx; y = padding + cy; break;
        case 'middle-left': x = padding + cx; y = h / 2; break;
        case 'middle-center': x = w / 2; y = h / 2; break;
        case 'middle-right': x = w - padding - cx; y = h / 2; break;
        case 'bottom-left': x = padding + cx; y = h - padding - cy; break;
        case 'bottom-center': x = w / 2; y = h - padding - cy; break;
        case 'bottom-right': x = w - padding - cx; y = h - padding - cy; break;
        default: x = w / 2; y = h / 2;
      }
      return { x, y };
    }

    function drawSingle(ctx, w, h, angle, drawFn, elemW, elemH, isImage = false) {
      const { x, y } = getCoords(state.position, w, h, elemW, elemH);
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      drawFn(0, 0);
    }

    function drawTiled(ctx, w, h, angle, drawFn, gapX, gapY) {
      ctx.translate(w / 2, h / 2);
      ctx.rotate(angle * Math.PI / 180);

      const diag = Math.sqrt(w * w + h * h);
      const cols = Math.ceil(diag / gapX) + 2;
      const rows = Math.ceil(diag / gapY) + 2;

      for (let r = -rows; r <= rows; r++) {
        for (let c = -cols; c <= cols; c++) {
          drawFn(c * gapX, r * gapY);
        }
      }
    }

    // --- Event Handlers ---

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      document.body.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });
    document.body.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

    els.fileInput.addEventListener('change', e => handleFiles(e.target.files));

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); history.undo(); }
      if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) { e.preventDefault(); history.redo(); }
    });

    els.undoBtn.addEventListener('click', () => history.undo());
    els.redoBtn.addEventListener('click', () => history.redo());

    els.modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) return;
        const snapshot = history.capture();
        els.modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.watermarkMode = btn.dataset.mode;
        els.textControls.classList.toggle('hidden', state.watermarkMode !== 'text');
        els.imageControls.classList.toggle('hidden', state.watermarkMode !== 'image');
        history.pushSnapshot(snapshot);
        renderCanvas();
      });
    });

    els.logoInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      const snapshot = history.capture();
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          state.logo = img;
          els.logoPreview.innerHTML = `<img src="${ev.target.result}" class="w-full h-full object-contain">`;
          history.pushSnapshot(snapshot);
          renderCanvas();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function setupInputHistory(element, eventListener = null) {
      element.addEventListener('focus', () => { tempStateBeforeChange = history.capture(); });
      element.addEventListener('change', () => {
        if (tempStateBeforeChange) {
          history.pushSnapshot(tempStateBeforeChange);
          tempStateBeforeChange = null;
        }
        if (eventListener) eventListener();
      });
      if (eventListener) element.addEventListener('input', eventListener);
    }

    function setupRangeHistory(element, updateFn) {
      element.addEventListener('mousedown', () => { tempStateBeforeChange = history.capture(); });
      element.addEventListener('touchstart', () => { tempStateBeforeChange = history.capture(); }, { passive: true });
      element.addEventListener('change', () => {
        if (tempStateBeforeChange) {
          history.pushSnapshot(tempStateBeforeChange);
          tempStateBeforeChange = null;
        }
      });
      element.addEventListener('input', updateFn);
    }

    setupInputHistory(els.watermarkText, renderCanvas);
    setupInputHistory(els.fontSize, renderCanvas);
    setupInputHistory(els.fontColor, renderCanvas);

    setupRangeHistory(els.opacity, () => {
      document.getElementById('opacityValue').textContent = `${els.opacity.value}%`;
      renderCanvas();
    });

    setupRangeHistory(els.rotation, () => {
      document.getElementById('rotationValue').textContent = `${els.rotation.value}°`;
      renderCanvas();
    });

    setupRangeHistory(els.logoScale, () => {
      document.getElementById('scaleValue').textContent = `${els.logoScale.value}%`;
      renderCanvas();
    });

    els.positionBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const snapshot = history.capture();
        els.positionBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.position = btn.dataset.pos;
        history.pushSnapshot(snapshot);
        renderCanvas();
      });
    });

    els.tileMode.addEventListener('change', () => {
      const snapshot = history.capture();
      state.tileMode = els.tileMode.checked;
      history.pushSnapshot(snapshot);
      renderCanvas();
    });

    // --- Batch Download ---
    async function handleDownload() {
      if (state.images.length === 0 || state.processing) return;

      state.processing = true;
      setDownloadBtnState(true, true, "处理中...");

      const zip = new JSZip();
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');

      for (let i = 0; i < state.images.length; i++) {
        const item = state.images[i];
        const img = item.img;

        offCanvas.width = img.width;
        offCanvas.height = img.height;
        offCtx.drawImage(img, 0, 0);

        const alpha = Math.max(0.05, Math.min(1, parseInt(els.opacity.value) / 100));
        const angle = parseInt(els.rotation.value) || 0;

        offCtx.save();
        offCtx.globalAlpha = alpha;

        if (state.watermarkMode === 'image' && state.logo) {
          const scale = Math.max(5, parseInt(els.logoScale.value)) / 100;
          let lw = state.logo.width;
          let lh = state.logo.height;
          const maxLW = offCanvas.width * scale;
          const maxLH = offCanvas.height * scale;
          const ratio = Math.min(maxLW / lw, maxLH / lh, 1);
          lw *= ratio; lh *= ratio;
          if (state.tileMode) {
            drawTiledOnCtx(offCtx, offCanvas.width, offCanvas.height, angle, (x, y) => offCtx.drawImage(state.logo, x - lw / 2, y - lh / 2, lw, lh), lw + 30, lh + 30);
          } else {
            drawSingleOnCtx(offCtx, offCanvas.width, offCanvas.height, angle, (x, y) => offCtx.drawImage(state.logo, x - lw / 2, y - lh / 2, lw, lh), lw, lh);
          }
        } else {
          const text = els.watermarkText.value;
          if (text.trim()) {
            const size = Math.max(12, parseInt(els.fontSize.value));
            const color = els.fontColor.value;
            offCtx.font = `bold ${size}px "Space Grotesk", sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = hexToRgba(color, 1);
            const metrics = offCtx.measureText(text);
            if (state.tileMode) {
              drawTiledOnCtx(offCtx, offCanvas.width, offCanvas.height, angle, (x, y) => offCtx.fillText(text, x, y), metrics.width + 50, size * 2);
            } else {
              drawSingleOnCtx(offCtx, offCanvas.width, offCanvas.height, angle, (x, y) => offCtx.fillText(text, x, y), metrics.width, size);
            }
          }
        }
        offCtx.restore();
        const blob = await new Promise(resolve => offCanvas.toBlob(resolve, 'image/png'));
        zip.file(`watermarked_${item.name.replace(/\.[^/.]+$/, "")}.png`, blob);
      }

      const content = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = `watermarks_${Date.now()}.zip`;
      link.click();

      state.processing = false;
      setDownloadBtnState(false, false, "下载全部 (ZIP)");
    }

    // Attach listeners to both buttons
    els.downloadBtnDesktop.addEventListener('click', handleDownload);
    els.downloadBtnMobile.addEventListener('click', handleDownload);

    function drawSingleOnCtx(ctx, w, h, angle, drawFn, elemW, elemH) {
      const { x, y } = getCoords(state.position, w, h, elemW, elemH);
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      drawFn(0, 0);
    }

    function drawTiledOnCtx(ctx, w, h, angle, drawFn, gapX, gapY) {
      ctx.translate(w / 2, h / 2);
      ctx.rotate(angle * Math.PI / 180);
      const diag = Math.sqrt(w * w + h * h);
      const cols = Math.ceil(diag / gapX) + 2;
      const rows = Math.ceil(diag / gapY) + 2;
      for (let r = -rows; r <= rows; r++) {
        for (let c = -cols; c <= cols; c++) {
          drawFn(c * gapX, r * gapY);
        }
      }
    }

  </script>
